[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "latticeag-forge-distill"
version = "0.3.0"
description = "Correctness-by-construction distillation for agentic tool-calling models"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
# transformers is not a runtime dependency. --check-tokenizer needs a local
# `pip install transformers` only.
dependencies = [
  "httpx>=0.27",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
distill = "distill_tools:main"
eval_card = "eval_card:main"
export_sft = "export_sft:main"

[tool.setuptools]
license-files = ["LICENSE"]
package-dir = {"" = "src"}
py-modules = [
  "agentic_plans",
  "archive_data",
  "curriculum",
  "distill_tools",
  "dpo_pairs",
  "eval_card",
  "eval_live",
  "export_sft",
  "mock_tools",
  "prose_writer",
  "seed_bank",
  "status",
  "verifier",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
