name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # requirements.txt is a pin fallback; CI installs from pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: |
          pytest -q
          distill --help && eval_card --help && export_sft --help
